<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 60px;
  color: #333;
  line-height: 1.8;
  font-size: 14px;
}
h1 {
  text-align: center;
  font-size: 24px;
  color: #1a1a1a;
  margin-bottom: 30px;
}

/* 章节标题 */
h2 {
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  padding: 8px 20px;
  border-radius: 6px;
  margin: 0 0 12px 0;
  letter-spacing: 1px;
  page-break-after: avoid;
  break-after: avoid;
}
h2.hf { background: linear-gradient(135deg, #f093fb, #f5576c); background: -webkit-gradient(linear, left top, right bottom, from(#f093fb), to(#f5576c)); background-repeat: no-repeat !important; margin-top: 0; }
h2.gh { background: linear-gradient(135deg, #4facfe, #00f2fe); background: -webkit-gradient(linear, left top, right bottom, from(#4facfe), to(#00f2fe)); background-repeat: no-repeat !important; color: #1a1a2e; margin-top: 24px; }
h2.news { background: linear-gradient(135deg, #667eea, #764ba2); background: -webkit-gradient(linear, left top, right bottom, from(#667eea), to(#764ba2)); background-repeat: no-repeat !important; margin-top: 32px; margin-bottom: 18px; }

/* 卡片网格 - inline-block 两列 */
.card-grid {
  font-size: 0;
  margin-bottom: 0;
}
.card-grid .card {
  display: inline-block;
  width: 49%;
  vertical-align: top;
  margin: 0 1% 8px 0;
  font-size: 14px;
  box-sizing: border-box;
  page-break-inside: avoid;
  break-inside: avoid;
}
.card-grid .card:nth-child(even) {
  margin-right: 0;
}

/* 卡片 */
.card {
  background: #fafbfc;
  border: 1px solid #eef0f3;
  border-radius: 8px;
  padding: 10px 14px;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: #1a1a1a;
  margin: 0 0 6px 0;
  word-break: break-all;
}
.card-tags {
  margin-bottom: 4px;
}
.tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  white-space: nowrap;
  border: 1px solid;
  margin-right: 6px;
  margin-bottom: 3px;
}
.tag.lang { color: #6c5ce7; background: #f0edff; border-color: #ddd6fe; }
.tag.pipeline { color: #00a676; background: #eafaf3; border-color: #b8e6d0; }
.tag.stat { color: #5a6c7d; background: #f0f3f6; border-color: #dde3ea; }
.tag.license { color: #8b7fc7; background: #f3f1fa; border-color: #ddd8f0; }
.card-desc {
  font-size: 14px;
  color: #555;
  margin: 4px 0 0 0;
  line-height: 1.6;
}
.card-update {
  font-size: 12px;
  color: #999;
  margin: 4px 0 0 0;
  line-height: 1.4;
  font-style: italic;
}

/* 段落样式 - 行业资讯 */
.item {
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #e0e0e0;
  page-break-inside: avoid;
  break-inside: avoid;
}
.item strong {
  color: #1a1a1a;
  font-size: 15px;
}
.item p {
  margin: 4px 0 0 0;
  color: #555;
}

.footer {
  text-align: center;
  margin-top: 40px;
  color: #aaa;
  font-size: 11px;
}
.footer::before, .footer::after {
  content: '';
  display: inline-block;
  width: 40px;
  height: 1px;
  background: #e0e0e0;
  vertical-align: middle;
  margin: 0 10px;
}
</style>
</head>
<body>

<h1>AI行业近一周热点 · 2026年M月D日</h1>

<h2 class="news">📰 行业资讯</h2>
<div class="item">
<p><strong>1. 资讯标题</strong></p>
<p>资讯摘要</p>
</div>

<div class="footer">AI行业近一周热点 · 聚焦大模型和智能体领域</div>

</body>
</html>
